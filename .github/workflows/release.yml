name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      application-name:
        description: 'Application name'
        required: true
jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: uat
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Anypoint CLI
        run: |
          npm install -g anypoint-cli-v4
      
